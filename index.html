<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>O.R.A 战略决策终端 // 2026</title>
<script src="ora_data.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#fefdfb;--text:#0f0f0f;--accent:#8b0000;--gold:#c4955a;--panel:#f9f8f6;--border:rgba(0,0,0,0.08)}
body{background:var(--bg);color:var(--text);font-family:"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;margin:0}
.container{border:1px solid var(--border);width:90%;max-width:420px;padding:36px 32px;background:var(--panel);position:relative}
.container::before{content:"安全节点: ORA-2026";position:absolute;top:-12px;left:20px;background:var(--bg);color:var(--accent);font-size:9px;padding:0 8px;letter-spacing:2px;border:1px solid var(--border)}
h2{font-family:"Courier New",monospace;font-size:11px;color:var(--accent);letter-spacing:3px;margin-bottom:16px;text-align:center}
label{display:block;font-size:10px;color:var(--accent);letter-spacing:2px;margin:12px 0 6px;font-weight:900}
select{width:100%;padding:12px;background:#fff;border:1px solid var(--border);color:var(--text);font-size:13px;outline:none;border-radius:0;margin-bottom:4px}
.btn{width:100%;padding:14px;background:transparent;border:1px solid var(--accent);color:var(--accent);font-size:12px;font-weight:bold;letter-spacing:3px;cursor:pointer;transition:all 0.3s;border-radius:0;margin-top:8px}
.btn:hover{background:var(--accent);color:#fff}
.hidden{display:none!important}
.report{padding:16px 0;text-align:left}
.report .sn{font-family:"Courier New",monospace;font-size:18px;color:var(--accent);letter-spacing:2px}
.report .nm{font-size:22px;margin:2px 0}
.report .md{display:inline-block;border:1px solid rgba(139,0,0,0.25);padding:2px 10px;font-size:10px;color:var(--accent);margin-bottom:8px}
.report .hr{border:0;height:1px;background:var(--border);margin:10px 0}
.report .sh{font-size:9px;color:#666;letter-spacing:1px;margin-bottom:4px;text-transform:uppercase}
.report .tx{font-size:12px;color:var(--text);margin-bottom:5px;line-height:1.5}
.report .tx strong{color:var(--accent)}
.report .badge{display:inline-block;background:rgba(196,149,90,0.08);border:1px solid rgba(196,149,90,0.12);padding:2px 10px;border-radius:3px;font-family:Inter,sans-serif;font-size:8px;letter-spacing:1px;color:var(--gold);text-transform:uppercase;margin-bottom:6px}
.report h1{font-family:"Playfair Display",serif;font-size:26px;font-weight:400;margin:2px 0;letter-spacing:1px}
.report .sub{font-size:14px;color:var(--gold);margin-bottom:6px}
.report .gl{width:20px;height:1.5px;background:var(--gold);margin:8px 0 12px}
.report .sec{margin-bottom:14px}
.report .sh{font-family:Inter,sans-serif;font-size:7px;letter-spacing:2px;text-transform:uppercase;color:#999;margin-bottom:4px}
.report p{font-size:10pt;line-height:1.6;color:#555;margin:2px 0}
.report strong{color:var(--gold);font-weight:500}
.report .model{font-size:10pt;line-height:1.6;color:var(--gold);font-weight:500;margin:2px 0}
.report .verse{margin:6px 0;padding:6px 10px;background:#f7f5f0;border-radius:3px;font-size:9.5pt;line-height:1.5;color:#666;font-style:italic}
.report .cmd{border-left:2px solid var(--gold);padding:6px 10px;font-size:11px;color:var(--gold);line-height:1.4;margin:4px 0}
.report .eg{border:1px solid var(--border);padding:6px 10px;font-size:11px;color:#999;line-height:1.4;margin:4px 0}
.report .cv{border-top:1px solid var(--border);padding-top:10px;margin-top:8px;font-size:10pt;line-height:1.6;color:#666;font-style:italic}
.report .report-section{margin:10px 0 4px;font-size:10px;color:var(--accent);letter-spacing:1px;font-weight:600}
.report .rl{margin:2px 0 2px 8px;font-size:10pt;line-height:1.6;color:#555}
.report .rl strong{color:var(--gold)}
.report .bar{display:flex;align-items:center;margin:3px 0}
.report .bar .bl{width:48px;font-size:9px;color:#666}
.report .bar .bt{flex:1;height:4px;background:#1a1a1a;margin:0 6px;border-radius:2px}
.report .bar .bf{height:4px;border-radius:2px}
.report .bar .br{width:20px;text-align:right;font-size:10px}
.loading{text-align:center;padding:16px;font-family:"Courier New",monospace;font-size:10px;color:var(--accent);animation:pulse 1.5s infinite}
@keyframes pulse{0%{opacity:0.3}50%{opacity:1}100%{opacity:0.3}}
.coin{display:flex;gap:14px;justify-content:center;margin:10px 0}
.coin .c{width:46px;height:46px;border:2px solid rgba(0,0,0,0.12);display:flex;align-items:center;justify-content:center;font-size:14px;color:#999;font-family:"Courier New",monospace}
.fbtn{width:100%;padding:10px;background:transparent;border:1px solid var(--accent);color:var(--accent);font-size:11px;letter-spacing:2px;cursor:pointer;margin:3px 0}
.fbtn:hover{background:var(--accent);color:#fff}
#msg{font-size:10px;color:var(--accent);text-align:center;margin:6px 0}
.bn{text-align:center;font-size:32px;margin:8px 0;font-family:"Courier New",monospace;letter-spacing:4px}
</style>
</head>
<body>
<div class="container" id="app">

<div id="s1">
<h2>>> 终端系统网关 V2.9 <<</h2>
<label>真实年纪 // AGE</label>
<select id="age"><option value="">选择生命周期...</option>
<option value="25岁以下">25岁以下</option><option value="25-35岁">25-35岁</option><option value="35-45岁">35-45岁</option><option value="45-55岁">45-55岁</option><option value="55岁以上">55岁以上</option></select>
<label>战略场景 // SCENARIO</label>
<select id="topic"><option value="">选择核验场景...</option>
<option value="求财">求财 · Wealth</option><option value="谋事">谋事 · Career</option><option value="婚姻">婚姻 · Relationship</option><option value="生意综合">生意 · Business</option><option value="功名">功名 · Achievement</option><option value="合伙">合伙 · Partnership</option><option value="家宅">家宅 · Home</option><option value="占病">占病 · Health</option>
<option value="学艺">学艺 · Learning</option>
<option value="开铺">开铺 · Store</option>
<option value="置货">置货 · Inventory</option>
<option value="出外">出外 · Travel</option>
<option value="失物">失物 · Lost</option>
<option value="六甲">六甲 · Pregnancy</option>
<option value="官讼">官讼 · Litigation</option>
<option value="行人">行人 · Traveler</option></select>
<button class="btn" onclick="go2()">[ 建立安全链接 ]</button>
</div>

<div id="s2" class="hidden">
<h2>>> 能量校准 <<</h2>
<button class="btn" onclick="draw()" id="drawBtn">[ 执行数据提取 ]</button>
<div class="loading hidden" id="loading">数据提取中...</div>
<div class="bn" id="signNum">--</div>
<div style="text-align:center;font-size:11px;color:#666;letter-spacing:1px" id="signName"></div>
<div id="calib" class="hidden">
<div class="coin"><div class="c" id="c1">?</div><div class="c" id="c2">?</div></div>
<button class="fbtn" onclick="flip()" id="flipBtn">[ 投掷圣杯 ]</button>
<div id="msg"></div>
<button class="fbtn hidden" onclick="retryDraw()" id="retryBtn">[ 重新摇签 ]</button>
<button class="btn hidden" onclick="go3()" id="nextBtn">[ 生成机密档案 ]</button>
</div>
</div>

<div id="s3" class="hidden">
<h2>>> 机密档案 <<</h2>
<div class="report" id="report"></div>
<button class="btn" onclick="unlock()">[ UNLOCK FULL DOSSIER — ¥19.9 ]</button>
</div>

</div>

<script>
const BC=["#8B0000","#c4955a","#2a6a4a","#4a6a8a","#8a6a4a"],RK=["逆商","红利","决断力","环境","内耗"];
const EM={"求财":"Green Tourmaline · Dark green & gold","谋事":"Black Tourmaline · Black & white","婚姻":"Pink Tourmaline · Rose & cream","占病":"Green Tourmaline · Soothing green","家宅":"Watermelon Tourmaline · Warm neutrals","功名":"Blue Tourmaline · Navy & silver","生意综合":"Black + Green Tourmaline","合伙":"Green Tourmaline + Gold","学艺":"Yellow Tourmaline · Bright accents","开铺":"Black Tourmaline · Gold accents","置货":"Green Tourmaline · Earth tones","出外":"Black Tourmaline · Travel protection","失物":"Tourmaline focus stone","六甲":"Watermelon Tourmaline","官讼":"Blue Tourmaline","行人":"Black Tourmaline"};
function pr(s){const r={逆商:0,红利:0,决断力:0,环境:0,内耗:0};(s||'').match(/[一-鿿]+?\d+/g)?.forEach(m=>{const k=m.match(/[一-鿿]+/)?.[0],v=parseInt(m.match(/\d+/)?.[0]);if(k&&r[k]!==void 0)r[k]=v});return r}
let st={age:'',topic:'',sn:'',sd:null},freeData={};
function go2(){st.age=document.getElementById('age').value;st.topic=document.getElementById('topic').value;if(!st.age||!st.topic)return alert("请先完成参数校准");document.getElementById('s1').classList.add('hidden');document.getElementById('s2').classList.remove('hidden')}
function draw(){const btn=document.getElementById('drawBtn'),ld=document.getElementById('loading');btn.classList.add('hidden');ld.classList.remove('hidden');let c=0;const i=setInterval(()=>{const r=Math.floor(Math.random()*51)+1;k="第"+["一","二","三","四","五","六","七","八","九","十","十一","十二","十三","十四","十五","十六","十七","十八","十九","二十","二十一","二十二","二十三","二十四","二十五","二十六","二十七","二十八","二十九","三十","三十一","三十二","三十三","三十四","三十五","三十六","三十七","三十八","三十九","四十","四十一","四十二","四十三","四十四","四十五","四十六","四十七","四十八","四十九","五十","五十一"][r-1]+"签";document.getElementById('signNum').textContent=k;document.getElementById('signName').textContent=ORA_DATA[k]?.name||'';c++;if(c>25){clearInterval(i);ld.classList.add('hidden');st.sn=k;st.sd=ORA_DATA[k];document.getElementById('calib').classList.remove('hidden')}},60)}
function flip(){const c1=Math.random()>0.5?'阳':'阴',c2=Math.random()>0.5?'阳':'阴';document.getElementById('c1').textContent=c1;document.getElementById('c1').style.color='#0f0f0f';document.getElementById('c1').style.borderColor='#8b0000';document.getElementById('c2').textContent=c2;document.getElementById('c2').style.color='#0f0f0f';document.getElementById('c2').style.borderColor='#8b0000';const msg=document.getElementById('msg');document.getElementById('flipBtn').classList.add('hidden');if(c1!==c2){msg.innerHTML="【圣杯】校准完成";document.getElementById('nextBtn').classList.remove('hidden')}else{const t=c1==='阳'?'笑':'阴';msg.innerHTML="【"+t+"杯】此签不作数，请重新摇签";document.getElementById('retryBtn').classList.remove('hidden')}}
function retryDraw(){['c1','c2'].forEach(id=>{const el=document.getElementById(id);el.textContent='?';el.style.color='#999';el.style.borderColor='rgba(0,0,0,0.12)'});document.getElementById('msg').textContent='';document.getElementById('signNum').textContent='--';document.getElementById('signName').textContent='';st.sn='';st.sd=null;document.getElementById("flipBtn").classList.remove("hidden");document.getElementById('retryBtn').classList.add('hidden');document.getElementById('nextBtn').classList.add('hidden');draw()}
function go3(){document.getElementById('s2').classList.add('hidden');document.getElementById('s3').classList.remove('hidden');const d=st.sd;if(!d)return;const eg=EM[st.topic]||"Black Tourmaline";const cc={'爆发期':'Now is your time. Momentum is real.','蛰伏期':'Strength underground. Trust the process.','重组期':'The old must end before the new begins.','破局期':'Breakthrough is near. Last obstacles before open ground.','盘整期':'Strategic patience yields tenfold returns.','危机期':'Conserve. Trust your foundation. This too passes.','避险期':'The wise know when to retreat.'};let con='The wisdom of Xuanwushan guides your next move.';for(let k in cc){if(d.model&&d.model.indexOf(k)>=0){con=cc[k];break}}const rp=document.getElementById('report');if(freeData[st.topic]&&freeData[st.topic][st.sn]&&freeData[st.topic][st.sn][st.age]){rp.innerHTML='<div class="badge">'+st.topic+'</div><h1>'+st.sn+'</h1><div class="sub">'+d.name+'</div><div class="gl"></div>'+freeData[st.topic][st.sn][st.age]+'<div class="sec"><div class="sh">&#9670; 能量指南 · Energy</div><div class="eg">'+eg+'</div></div><div class="cv">'+con+'</div>';return}rp.innerHTML='<div class="loading" style="animation:none;padding:30px">加载报告中...</div>';fetch('free_reports/'+encodeURIComponent(st.topic)+'.json').then(r=>r.json()).then(data=>{freeData[st.topic]=data;const h=data[st.sn]&&data[st.sn][st.age];if(h){rp.innerHTML='<div class="badge">'+st.topic+'</div><h1>'+st.sn+'</h1><div class="sub">'+d.name+'</div><div class="gl"></div>'+h+'<div class="sec"><div class="sh">&#9670; 能量指南 · Energy</div><div class="eg">'+eg+'</div></div><div class="cv">'+con+'</div>'}else{rp.innerHTML='<div class="loading" style="animation:none;padding:20px;color:#c00">未找到该报告</div>'}}).catch(()=>{const bars='';RK.forEach((k,i)=>{const v=pr(d.radar)[k];bars+='<div class="bar"><span class="bl">'+k+'</span><div class="bt"><div class="bf" style="width:'+v+'%;background:'+BC[i]+'"></div></div><span class="br" style="color:'+BC[i]+'">'+v+'</span></div>'});rp.innerHTML='<div class="badge">'+st.topic+'</div><h1>'+st.sn+'</h1><div class="sub">'+d.name+'</div><div class="gl"></div><div class="sec"><div class="sh">&#9670; 卷宗还原 · Codex</div><p><strong>'+d.ji+'</strong></p><p>'+d.story+'</p>'+(d.poem?'<div class="verse">签诗 · '+d.poem+'</div>':'')+(d.fortune?'<p>'+d.fortune+'</p>':'')+(d.yearly?'<p><strong>岁君</strong>：'+d.yearly+'</p>':'')+'</div><div class="sec"><div class="sh">&#9670; 战略态 · Archetype</div><p class="model">'+d.model+'</p><p><strong>核心优势</strong>：'+d.adv+'</p><p><strong>致命盲区</strong>：'+d.blind+'</p></div><div class="sec"><div class="sh">&#9670; 五维势能 · Radar</div>'+bars+'</div><div class="sec"><div class="sh">&#9670; 核心指令 · Directive</div><div class="cmd">'+d.cmd+'</div></div><div class="sec"><div class="sh">&#9670; 能量指南 · Energy</div><div class="eg">'+eg+'</div></div><div class="cv">'+con+'</div>'})}
function unlock(){const n=parseInt(st.sn.replace(/\D/g,''))||1;window.open('https://o-r-alab.myshopify.com/products/strategic-alignment-protocol?oracle_id='+n,'_blank')}
</script>
</body>
</html>
