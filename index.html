<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>O.R.A 战略决策终端</title>
<script src="ora_data.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f7f5f0;--card:#ffffff;--text:#2c2c2c;--gold:#c4955a;--red:#8B0000;--mute:#999;--border:rgba(0,0,0,0.06)}
body{background:var(--bg);color:var(--text);font-family:"Noto Serif SC","Source Han Serif SC",serif;min-height:100vh;display:flex;align-items:center;justify-content:center;margin:0;padding:16px}
.container{background:var(--card);width:100%;max-width:440px;padding:32px 28px;border-radius:6px;box-shadow:0 2px 12px rgba(0,0,0,0.03);position:relative}
h2{font-family:"Playfair Display","Georgia",serif;font-size:13px;color:var(--gold);letter-spacing:3px;margin-bottom:16px;text-align:center;font-weight:400}
label{display:block;font-size:9px;color:var(--mute);letter-spacing:2px;margin:12px 0 4px;text-transform:uppercase;font-family:"Inter",sans-serif}
select{width:100%;padding:10px 12px;background:var(--bg);border:1px solid var(--border);color:var(--text);font-size:13px;outline:none;border-radius:4px;margin-bottom:4px;font-family:"Noto Serif SC",serif}
.btn{width:100%;padding:12px;background:#fff;border:1px solid var(--gold);color:var(--gold);font-size:11px;font-family:"Inter",sans-serif;letter-spacing:2px;cursor:pointer;transition:all 0.2s;border-radius:4px;margin-top:8px;text-transform:uppercase}
.btn:hover{background:var(--gold);color:#fff}
.hidden{display:none!important}

/* Draw area */
.draw-area{text-align:center;padding:16px 0}
.draw-num{font-family:"Playfair Display",serif;font-size:36px;color:var(--red);letter-spacing:2px;margin:10px 0 2px}
.draw-name{font-size:14px;color:var(--mute);margin-bottom:12px}

/* Calibration */
.calib-area{text-align:center;margin:8px 0}
.coins{display:flex;gap:12px;justify-content:center;margin:8px 0}
.coin{width:42px;height:42px;border:1.5px solid var(--border);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--mute);font-family:"Inter",sans-serif;background:var(--bg)}
.fbtn{width:100%;padding:8px;background:var(--bg);border:1px solid var(--border);color:var(--mute);font-size:10px;font-family:"Inter",sans-serif;letter-spacing:1px;cursor:pointer;border-radius:4px;margin:3px 0}
.fbtn:hover{border-color:var(--gold);color:var(--gold)}
#msg{font-size:10px;color:var(--gold);text-align:center;margin:6px 0;font-family:"Inter",sans-serif}

/* Report */
.report{padding:16px 0}
.report .badge{display:inline-block;background:rgba(196,149,90,0.08);border:1px solid rgba(196,149,90,0.12);padding:2px 10px;border-radius:3px;font-family:"Inter",sans-serif;font-size:8px;letter-spacing:1px;color:var(--gold);text-transform:uppercase;margin-bottom:6px}
.report h1{font-family:"Playfair Display",serif;font-size:26px;font-weight:400;margin:0;letter-spacing:1px}
.report .sub{font-size:13px;color:var(--gold);margin-bottom:8px}
.report .gl{width:20px;height:1.5px;background:var(--gold);margin:8px 0 12px}
.report .sec{margin-bottom:14px}
.report .sh{font-family:"Inter",sans-serif;font-size:7px;letter-spacing:2px;text-transform:uppercase;color:var(--mute);margin-bottom:4px}
.report p{font-size:10pt;line-height:1.6;color:#555;margin:2px 0}
.report strong{color:var(--red);font-weight:500}
.report .bar{display:flex;align-items:center;margin:3px 0}
.report .bar .bl{width:44px;font-size:8px;color:var(--mute);font-family:"Inter",sans-serif;text-transform:uppercase}
.report .bar .bt{flex:1;height:4px;background:#f0ece4;border-radius:2px;margin:0 6px}
.report .bar .bf{height:4px;border-radius:2px}
.report .bar .br{width:20px;text-align:right;font-size:9px;font-family:"Inter",sans-serif;font-weight:600}
.report .cmd{border-left:2px solid var(--gold);padding:6px 12px;font-size:9.5pt;line-height:1.5;color:var(--gold);font-weight:500;margin:4px 0}
.report .cv{border-top:1px solid var(--border);padding-top:10px;margin-top:8px;font-size:10pt;line-height:1.6;color:#666;font-style:italic}
</style>
</head>
<body>
<div class="container" id="app">

<!-- Step 1: Settings -->
<div id="s1">
<h2>O.R.A Strategic Terminal</h2>
<label>Life Stage</label>
<select id="age"><option value="">— Select —</option>
<option value="25岁以下">25 and under</option><option value="25-35岁">25–35</option>
<option value="35-45岁">35–45</option><option value="45-55岁">45–55</option><option value="55岁以上">55+</option></select>
<label>Focus Area</label>
<select id="topic"><option value="">— Select —</option>
<option value="求财">Wealth / 求财</option><option value="谋事">Career / 谋事</option>
<option value="婚姻">Relationship / 婚姻</option><option value="生意综合">Business / 生意</option>
<option value="功名">Achievement / 功名</option><option value="合伙">Partnership / 合伙</option>
<option value="家宅">Home / 家宅</option><option value="占病">Health / 占病</option>
<option value="学艺">Learning / 学艺</option>
<option value="开铺">Store / 开铺</option>
<option value="置货">Inventory / 置货</option>
<option value="出外">Travel / 出外</option>
<option value="失物">Lost Items / 失物</option>
<option value="六甲">Pregnancy / 六甲</option>
<option value="官讼">Litigation / 官讼</option>
<option value="行人">Traveler / 行人</option>
</select>
<button class="btn" onclick="go2()">INITIATE SEQUENCE</button>
</div>

<!-- Step 2: Draw -->
<div id="s2" class="hidden">
<h2>Draw Your Omen</h2>
<button class="btn" onclick="draw()" id="drawBtn">TRANSMIT SIGNAL</button>
<div class="draw-area hidden" id="drawArea">
<div class="draw-num" id="signNum">--</div>
<div class="draw-name" id="signName"></div>
<div class="calib-area" id="calib">
<p style="font-size:9px;color:var(--mute);margin:6px 0;font-family:Inter,sans-serif">Energy Calibration</p>
<div class="coins"><div class="coin" id="c1">?</div><div class="coin" id="c2">?</div></div>
<button class="fbtn" onclick="flip()" id="flipBtn">TOSS COINS</button>
<div id="msg"></div>
<button class="fbtn hidden" onclick="resetDraw()" id="retryBtn">RETRY</button>
<button class="btn hidden" onclick="go3()">ACCESS DOSSIER</button>
</div></div>
<div class="loading hidden" id="loading" style="text-align:center;padding:12px;font-family:Inter,sans-serif;font-size:9px;color:var(--gold);letter-spacing:2px">TRANSMITTING...</div>
</div>

<!-- Step 3: Free Report -->
<div id="s3" class="hidden">
<h2>Strategic Preview</h2>
<div class="report" id="report"></div>
<button class="btn" onclick="unlock()">UNLOCK FULL DOSSIER — ¥19.9</button>
</div>

</div>

<script>
const BC=["#8B0000","#c4955a","#2a6a4a","#4a6a8a","#8a6a4a"],RK=["逆商","红利","决断力","环境","内耗"];
const EM={"求财":"Green Tourmaline · Dark green & gold","谋事":"Black Tourmaline · Black & white","婚姻":"Pink Tourmaline · Rose & cream","占病":"Green Tourmaline · Soothing green","家宅":"Watermelon Tourmaline · Warm neutrals","功名":"Blue Tourmaline · Navy & silver","生意综合":"Black + Green Tourmaline","合伙":"Green Tourmaline + Gold","学艺":"Yellow Tourmaline · Bright","开铺":"Black Tourmaline · Gold","置货":"Green Tourmaline · Earth tones","出外":"Black Tourmaline · Travel","失物":"Tourmaline focus stone","六甲":"Watermelon Tourmaline","官讼":"Blue Tourmaline","行人":"Black Tourmaline","学艺":"Yellow Tourmaline · Gold","开铺":"Black Tourmaline · Gold accent","置货":"Green Tourmaline · Earth","出外":"Black Tourmaline · Travel","失物":"Tourmaline · Calming","六甲":"Watermelon Tourmaline · Soft","官讼":"Blue Tourmaline · White"};
const CC={"爆发期":"Now is your time. The oracle confirms your momentum is real.","蛰伏期":"Strength is underground. Trust the process.","重组期":"The old must end before the new begins.","破局期":"Breakthrough is near. The last obstacles are before open ground.","盘整期":"Strategic patience yields tenfold returns.","危机期":"Conserve. Trust your foundation. This too passes.","避险期":"The wise know when to retreat."};
const DC="The wisdom of Xuanwushan guides your next move.";
function pr(s){const r={逆商:0,红利:0,决断力:0,环境:0,内耗:0};(s||'').match(/[一-鿿]+?\d+/g)?.forEach(m=>{const k=m.match(/[一-鿿]+/)?.[0],v=parseInt(m.match(/\d+/)?.[0]);if(k&&r[k]!==void 0)r[k]=v});return r}
let st={age:'',topic:'',sn:'',sd:null};

function go2(){st.age=document.getElementById('age').value;st.topic=document.getElementById('topic').value;if(!st.age||!st.topic)return alert("Please select both options");document.getElementById('s1').classList.add('hidden');document.getElementById('s2').classList.remove('hidden')}

function draw(){const btn=document.getElementById('drawBtn'),ld=document.getElementById('loading'),da=document.getElementById('drawArea');btn.classList.add('hidden');ld.classList.remove('hidden');let c=0,sn='';const i=setInterval(()=>{const r=Math.floor(Math.random()*51)+1;sn="第"+["一","二","三","四","五","六","七","八","九","十","十一","十二","十三","十四","十五","十六","十七","十八","十九","二十","二十一","二十二","二十三","二十四","二十五","二十六","二十七","二十八","二十九","三十","三十一","三十二","三十三","三十四","三十五","三十六","三十七","三十八","三十九","四十","四十一","四十二","四十三","四十四","四十五","四十六","四十七","四十八","四十九","五十","五十一"][r-1]+"签";document.getElementById('signNum').textContent=sn;document.getElementById('signName').textContent=ORA_DATA[sn]?.name||'';c++;if(c>25){clearInterval(i);ld.classList.add('hidden');da.classList.remove('hidden');st.sn=sn;st.sd=ORA_DATA[sn];console.log('Draw:',sn,st.sd?.name)}},60)}

function flip(){const c1=Math.random()>0.5?'阳':'阴',c2=Math.random()>0.5?'阳':'阴';document.getElementById('c1').textContent=c1;document.getElementById('c1').style.color='#c4955a';document.getElementById('c1').style.borderColor='#c4955a';document.getElementById('c2').textContent=c2;document.getElementById('c2').style.color='#c4955a';document.getElementById('c2').style.borderColor='#c4955a';const msg=document.getElementById('msg');document.getElementById('flipBtn').classList.add('hidden');if(c1!==c2){msg.innerHTML="✦ Calibration Complete";document.getElementById('nextBtn').classList.remove('hidden')}else{const t=c1==='阳'?'Yang':'Yin';msg.innerHTML="✦ "+t+" Block — Clear and retry";document.getElementById('retryBtn').classList.remove('hidden')}}

function resetDraw(){document.getElementById("drawBtn").classList.remove("hidden");document.getElementById("drawArea").classList.add("hidden");document.getElementById("retryBtn").classList.add("hidden");document.getElementById("nextBtn").classList.add("hidden");document.getElementById("flipBtn").classList.remove("hidden");document.getElementById("msg").textContent="";document.getElementById("c1").textContent="?";document.getElementById("c1").style.color="#999";document.getElementById("c1").style.borderColor="rgba(0,0,0,0.06)";document.getElementById("c2").textContent="?";document.getElementById("c2").style.color="#999";document.getElementById("c2").style.borderColor="rgba(0,0,0,0.06)";document.getElementById("signNum").textContent="--";document.getElementById("signName").textContent=""}

function go3(){console.log('go3:',st.sn,st.sd?.name);document.getElementById('s2').classList.add('hidden');document.getElementById('s3').classList.remove('hidden');const d=st.sd;if(!d){document.getElementById('s3').innerHTML='<p style="color:#c4955a">Loading...</p>';return}const radar=pr(d.radar),eg=EM[st.topic]||"Black Tourmaline · Gold accent";let con=DC;for(const[k,v]of Object.entries(CC)){if(d.model.includes(k)){con=v;break}}let bars='';RK.forEach((k,i)=>{const v=radar[k];bars+=`<div class="bar"><span class="bl">${k}</span><div class="bt"><div class="bf" style="width:${v}%;background:${BC[i]}"></div></div><span class="br" style="color:${BC[i]}">${v}</span></div>`});
document.getElementById('report').innerHTML=`
<div class="badge">${st.topic}</div>
<h1>${st.sn}</h1>
<div class="sub">${d.name}</div>
<div class="gl"></div>
<div class="sec"><div class="sh">✦ Oracle Reading</div><p><strong>${d.ji}</strong></p><p>${d.story}</p></div>
<div class="sec"><div class="sh">✦ Strategic Archetype</div><p style="color:var(--gold);font-weight:500">${d.model}</p><p><strong>Advantage</strong>: ${d.adv}</p><p><strong>Blind Spot</strong>: ${d.blind}</p></div>
<div class="sec"><div class="sh">✦ Five Dimensions</div>${bars}</div>
<div class="sec"><div class="sh">✦ Core Directive</div><div class="cmd">${d.cmd}</div></div>
<div class="sec"><div class="sh">✦ Energy Configuration</div><p>${eg}</p></div>
<div class="cv">${con}</div>
`}

function unlock(){const n=parseInt(st.sn.replace(/\D/g,''))||1;window.open('https://o-r-alab.myshopify.com/products/strategic-alignment-protocol?oracle_id='+n,'_blank')}
</script>
</body>
</html>
